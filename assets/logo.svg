<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A7BD5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background subtle glow -->
  <rect width="100%" height="100%" fill="#0d1117" rx="10"/>
  <!-- Network Nodes & Edges -->
  <path d="M 60 45 L 90 30 L 120 55 L 90 95 L 50 85 Z" stroke="#00D2FF" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="60" cy="45" r="7" fill="#00D2FF"/>
  <circle cx="90" cy="30" r="5" fill="#3A7BD5"/>
  <circle cx="120" cy="55" r="8" fill="#00D2FF"/>
  <circle cx="90" cy="95" r="6" fill="#00D2FF"/>
  <circle cx="50" cy="85" r="5" fill="#3A7BD5"/>
  <!-- C Letter integrated -->
  <text x="160" y="95" font-family="Arial, sans-serif" font-weight="bold" font-size="70" fill="url(#grad)">CNetwork</text>
  <text x="165" y="120" font-family="Arial, sans-serif" font-size="16" fill="#8b949e">High-Performance C Network Analysis Library</text>
</svg>
